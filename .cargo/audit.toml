# cargo-audit configuration (read automatically by `cargo audit`).

[advisories]
ignore = [
    # RUSTSEC-2026-0459: libsqlite3-sys < 0.39 (C SQLite CVE-2026-119375).
    # libsqlite3-sys appears in Cargo.lock only via sqlx-sqlite 0.9.0, which
    # pins it to `>=0.30.1, <0.38.0`; no patched sqlx release exists yet.
    # This workspace enables only sqlx's `mysql` driver, and
    # `cargo tree -i libsqlite3-sys --target all -e all` shows it is not
    # compiled into any target. Remove this entry once sqlx allows >=0.39.
    "RUSTSEC-2026-0459",
]
